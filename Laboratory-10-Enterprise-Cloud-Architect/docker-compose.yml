version: '3'

services:
  db:
    image: mysql:8.0
    container_name: enterprise-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=CloudNova2026Root!
      - MYSQL_DATABASE=wordpress_db
      - MYSQL_USER=wordpress_user
      - MYSQL_PASSWORD=CloudNova2026Pass!
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    container_name: enterprise-wordpress
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=wordpress_user
      - WORDPRESS_DB_PASSWORD=CloudNova2026Pass!
      - WORDPRESS_DB_NAME=wordpress_db

volumes:
  db_data:
